[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netgear-plus-exporter"
version = "0.2.0"
description = "Prometheus exporter for NETGEAR Plus / Easy Smart Managed switches (no SNMP required)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["prometheus", "exporter", "netgear", "switch", "monitoring", "snmp-less"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "py-netgear-plus==0.6.4",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.2",
  "mypy==1.14.1",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "yamllint==1.38.0",
  "pyyaml==6.0.3",
]

[project.scripts]
netgear-plus-exporter = "netgear_plus_exporter.__main__:main"

[tool.setuptools.packages.find]
include = ["netgear_plus_exporter*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN", "BLE", "SLF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "SLF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

# py-netgear-plus ships no type information. Scoped to that module rather
# than a blanket --ignore-missing-imports, so a genuinely missing import
# elsewhere still fails.
[[tool.mypy.overrides]]
module = "py_netgear_plus.*"
ignore_missing_imports = true
