---
# Categories for GitHub's automatically generated release notes, driven by the
# labels on the pull requests included in a release.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Order is load-bearing twice over: it is the order the headings render in, and
# a pull request falls into the first category it matches. The "*" catch-all
# must stay last. A category whose labels are absent renders as nothing.
changelog:
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Fixes
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
