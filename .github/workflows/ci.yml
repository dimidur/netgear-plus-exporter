name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly-published advisory against unchanged code is still
  # caught. Most of what a dependency audit reports arrives without anyone
  # touching this repository.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: lint
        run: ruff check .

      # `ruff check` does not enforce formatting; without this, unformatted
      # code reaches main (it did).
      - name: format
        run: ruff format --check --diff .

      - name: types
        run: mypy netgear_plus_exporter

      - name: test
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: bandit
        run: bandit -q -r netgear_plus_exporter

      # Audits the resolved dependency tree, not just the direct pins.
      - name: pip-audit
        run: pip-audit --progress-spinner off --strict --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t netgear-plus-exporter:ci .

      - name: Container starts and rejects missing config
        run: |
          set +e
          out=$(docker run --rm netgear-plus-exporter:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -eq 2 || { echo "expected exit 2 without NETGEAR_EXPORTER_HOST"; exit 1; }

      # Trivy rather than Docker Scout: it needs no registry credentials, so
      # this gate also runs on pull requests from forks.
      - name: scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: netgear-plus-exporter:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
